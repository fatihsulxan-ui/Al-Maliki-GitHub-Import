<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restoran Sipariş Takip Paneli</title>
<style>
  :root {
    --surface-0: #f4f3ef;
    --surface-1: #eeece5;
    --surface-2: #ffffff;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --text-accent: #185fa5;
    --bg-accent: #e6f1fb;
    --text-warning: #854f0b;
    --bg-warning: #faeeda;
    --text-success: #3b6d11;
    --bg-success: #eaf3de;
    --border: rgba(0,0,0,0.08);
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #17171a;
      --surface-1: #202024;
      --surface-2: #26262b;
      --text-primary: #f2f2f0;
      --text-secondary: #b4b2a9;
      --text-muted: #888780;
      --border: rgba(255,255,255,0.1);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    margin: 0;
    padding: 1.5rem;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text-primary);
    border-radius: var(--radius);
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover { background: var(--surface-1); }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
  .stat-group { display: flex; gap: 12px; }
  .stat-card { background: var(--surface-1); border-radius: var(--radius); padding: 0.75rem 1rem; min-width: 100px; }
  .stat-label { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }
  .stat-value { font-size: 22px; font-weight: 500; margin: 0; }
  #board { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
  @media (max-width: 700px) { #board { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .col-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .col-title { font-size: 13px; font-weight: 500; margin: 0; }
  .col-count { font-size: 12px; color: var(--text-muted); }
  .cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .card { border-radius: 12px; padding: 0.75rem; background: var(--surface-2); border: 0.5px solid var(--border); }
  .card-title { font-size: 13px; font-weight: 500; margin: 0 0 4px; }
  .card-items { font-size: 12px; color: var(--text-secondary); margin: 0 0 6px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-bottom: 2px; }
  .advance-btn { width: 100%; margin-top: 6px; font-size: 12px; padding: 4px 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .done-label { font-size: 11px; color: var(--text-muted); }
  .empty { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="stat-group">
    <div class="stat-card">
      <p class="stat-label">Aktif sipariş</p>
      <p class="stat-value" id="stat-active">7</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Ort. süre</p>
      <p class="stat-value">18 dk</p>
    </div>
  </div>
  <button style="display:flex;align-items:center;gap:6px">+ Yeni sipariş</button>
</div>

<div id="board"></div>

<script>
const STATUSES = [
  { key: 'yeni', label: 'Yeni', next: 'hazirlaniyor', dot: '#185fa5' },
  { key: 'hazirlaniyor', label: 'Hazırlanıyor', next: 'hazir', dot: '#854f0b' },
  { key: 'hazir', label: 'Hazır', next: 'teslim', dot: '#3b6d11' },
  { key: 'teslim', label: 'Teslim edildi', next: null, dot: '#888780' }
];

let orders = [
  { id: 1, title: 'Masa 4', items: '2 adet · 340₺', status: 'yeni', time: '2 dk önce' },
  { id: 2, title: 'Paket #221', items: '3 adet · 510₺', status: 'yeni', time: '5 dk önce' },
  { id: 3, title: 'Masa 7', items: '4 adet · 620₺', status: 'hazirlaniyor', time: '12 dk' },
  { id: 4, title: 'Masa 2', items: '1 adet · 180₺', status: 'hazirlaniyor', time: '7 dk' },
  { id: 5, title: 'Paket #219', items: '2 adet · 295₺', status: 'hazirlaniyor', time: '15 dk' },
  { id: 6, title: 'Masa 1', items: '2 adet · 260₺', status: 'hazir', time: 'teslime hazır' },
  { id: 7, title: 'Masa 5', items: '3 adet · 410₺', status: 'teslim', time: 'tamamlandı' }
];

function statusMeta(key) { return STATUSES.find(s => s.key === key); }

function render() {
  const board = document.getElementById('board');
  document.getElementById('stat-active').textContent = orders.filter(o => o.status !== 'teslim').length;

  board.innerHTML = STATUSES.map(s => {
    const items = orders.filter(o => o.status === s.key);

    const cards = items.map(o => {
      const dimmed = s.key === 'teslim' ? 'opacity:0.7;' : '';
      const badgeBg = s.key === 'hazirlaniyor' ? 'var(--bg-warning)' : s.key === 'hazir' ? 'var(--bg-success)' : s.key === 'yeni' ? 'var(--bg-accent)' : 'transparent';
      const badgeText = s.key === 'hazirlaniyor' ? 'var(--text-warning)' : s.key === 'hazir' ? 'var(--text-success)' : s.key === 'yeni' ? 'var(--text-accent)' : 'var(--text-muted)';

      const footer = s.next
        ? `<button class="advance-btn" data-advance="${o.id}">${statusMeta(s.next).label} →</button>`
        : `<span class="done-label">✓ tamamlandı</span>`;

      const badge = s.key !== 'teslim'
        ? `<span class="badge" style="background:${badgeBg};color:${badgeText}">${o.time}</span>`
        : '';

      return `
      <div class="card" style="${dimmed}">
        <p class="card-title">${o.title}</p>
        <p class="card-items">${o.items}</p>
        ${badge}
        ${footer}
      </div>`;
    }).join('');

    return `
    <div>
      <div class="col-header">
        <span class="dot" style="background:${s.dot}"></span>
        <p class="col-title">${s.label}</p>
        <span class="col-count">${items.length}</span>
      </div>
      <div class="cards">
        ${cards || `<p class="empty">Boş</p>`}
      </div>
    </div>`;
  }).join('');
}

document.getElementById('board').addEventListener('click', e => {
  const btn = e.target.closest('[data-advance]');
  if (!btn) return;
  const id = Number(btn.dataset.advance);
  const order = orders.find(o => o.id === id);
  const meta = statusMeta(order.status);
  if (meta.next) {
    order.status = meta.next;
    order.time = 'şimdi';
  }
  render();
});

render();
</script>

</body>
</html>
