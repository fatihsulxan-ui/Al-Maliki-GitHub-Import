kind = "web"
previewPath = "/"
title = "ARAB ALI HOTEL Digital Menu"
description = "QR kodla açılan dijital restoran menüsü; müşteriler için masa bazlı sipariş deneyimi, garsonlar için sipariş ve masa çağrısı takibi, yöneticiler için menü ve masa yönetimi sunar."
version = "1.0.0"
id = "artifacts/restoran-menu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24236

[services.development]
run = "pnpm --filter @workspace/restoran-menu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/restoran-menu", "run", "build" ]
serve = "static"
publicDir = "artifacts/restoran-menu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24236"
BASE_PATH = "/"
